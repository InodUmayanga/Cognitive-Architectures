<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8fafc"/>
    </linearGradient>
    <linearGradient id="barGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#3f51b5"/>
      <stop offset="100%" stop-color="#0d9488"/>
    </linearGradient>
    <filter id="cardShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.08"/>
    </filter>
    <style>
      .title { font: 600 18px Roboto, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; }
      .subtitle { font: 400 12px Roboto, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #64748b; }
      .label { font: 600 12px Roboto, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #1e293b; text-anchor: middle; }
      .dim { font: 500 10.5px "JetBrains Mono", "SF Mono", Menlo, monospace; fill: #3f51b5; text-anchor: middle; }
      .op { font: 600 9.5px Roboto, Inter, sans-serif; fill: #ffffff; text-anchor: middle; }
      .cta { font: 600 12px Roboto, Inter, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; fill: #ffffff; text-anchor: middle; }
      .flow-line { stroke: #cbd5e1; stroke-width: 2; stroke-dasharray: 6 4; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .block-pulse-1 { animation: pulse 9s infinite 0s; }
      .block-pulse-2 { animation: pulse 9s infinite 1.2s; }
      .block-pulse-3 { animation: pulse 9s infinite 2.4s; }
      .block-pulse-4 { animation: pulse 9s infinite 3.6s; }
      .block-pulse-5 { animation: pulse 9s infinite 4.8s; }
      .block-pulse-6 { animation: pulse 9s infinite 6.0s; }
      .block-pulse-7 { animation: pulse 9s infinite 7.2s; }
      @keyframes pulse {
        0%, 18%, 100% { opacity: 0.85; transform: translateY(0px); }
        8% { opacity: 1; transform: translateY(-5px); }
      }
    </style>
  </defs>

  <!-- Material Light Card Surface -->
  <rect width="960" height="420" rx="14" fill="url(#bgGrad)" stroke="#e2e8f0" stroke-width="2"/>
  <line x1="0" y1="74" x2="960" y2="74" stroke="#e2e8f0" stroke-width="1"/>

  <!-- Header -->
  <text x="32" y="36" class="title">5-Block CNN Architecture Moving Pipeline (224×224×3 RGB → Flatten → Dense NN)</text>
  <text x="32" y="56" class="subtitle">Each Block performs: 3×3 Conv2D (expands channel depth) → ReLU max(0,x) → 2×2 Max Pooling (halves spatial height &amp; width)</text>

  <!-- Material Primary Action Button -->
  <rect x="720" y="20" width="210" height="36" rx="8" fill="#3f51b5" filter="url(#cardShadow)"/>
  <text x="825" y="42" class="cta">▶ Launch Interactive App</text>

  <!-- Connecting Flow Lines -->
  <line x1="90" y1="215" x2="860" y2="215" class="flow-line"/>

  <!-- Travelling Data Signal Particle -->
  <circle r="6.5" fill="#3f51b5" stroke="#ffffff" stroke-width="2">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 75,215 L 190,215 L 305,215 L 420,215 L 535,215 L 650,215 L 755,215 L 875,215"/>
  </circle>

  <!-- STAGE 0: Input 224x224x3 -->
  <g class="block-pulse-1">
    <rect x="48" y="137" width="36" height="136" rx="4" fill="#ffe4e6" stroke="#e11d48" stroke-width="1.5"/>
    <rect x="56" y="143" width="36" height="136" rx="4" fill="#ccfbf1" stroke="#0d9488" stroke-width="1.5"/>
    <rect x="64" y="149" width="36" height="136" rx="4" fill="#dbeafe" stroke="#2563eb" stroke-width="1.5"/>
    <text x="74" y="322" class="label">Input RGB</text>
    <text x="74" y="339" class="dim">224×224×3</text>
  </g>

  <!-- BLOCK 1: 112x112x64 -->
  <g class="block-pulse-2">
    <rect x="148" y="98" width="84" height="20" rx="5" fill="#0284c7"/>
    <text x="190" y="112" class="op">Conv+ReLU+Pool</text>
    <polygon points="168,153 202,153 216,141 182,141" fill="#bae6fd" stroke="#0284c7"/>
    <polygon points="202,153 216,141 216,255 202,267" fill="#38bdf8" stroke="#0284c7"/>
    <rect x="168" y="153" width="34" height="114" fill="#0284c7" stroke="#0369a1" stroke-width="1.5"/>
    <text x="190" y="322" class="label">Block 1</text>
    <text x="190" y="339" class="dim">112×112×64</text>
  </g>

  <!-- BLOCK 2: 56x56x128 -->
  <g class="block-pulse-3">
    <rect x="263" y="98" width="84" height="20" rx="5" fill="#2563eb"/>
    <text x="305" y="112" class="op">Conv+ReLU+Pool</text>
    <polygon points="278,165 308,165 330,149 300,149" fill="#bfdbfe" stroke="#2563eb"/>
    <polygon points="308,165 330,149 330,241 308,257" fill="#60a5fa" stroke="#2563eb"/>
    <rect x="278" y="165" width="30" height="92" fill="#2563eb" stroke="#1d4ed8" stroke-width="1.5"/>
    <text x="305" y="322" class="label">Block 2</text>
    <text x="305" y="339" class="dim">56×56×128</text>
  </g>

  <!-- BLOCK 3: 28x28x256 -->
  <g class="block-pulse-4">
    <rect x="378" y="98" width="84" height="20" rx="5" fill="#3f51b5"/>
    <text x="420" y="112" class="op">Conv+ReLU+Pool</text>
    <polygon points="390,177 416,177 446,157 420,157" fill="#c7d2fe" stroke="#3f51b5"/>
    <polygon points="416,177 446,157 446,229 416,249" fill="#818cf8" stroke="#3f51b5"/>
    <rect x="390" y="177" width="26" height="72" fill="#3f51b5" stroke="#303f9f" stroke-width="1.5"/>
    <text x="420" y="322" class="label">Block 3</text>
    <text x="420" y="339" class="dim">28×28×256</text>
  </g>

  <!-- BLOCK 4: 14x14x512 -->
  <g class="block-pulse-5">
    <rect x="493" y="98" width="84" height="20" rx="5" fill="#4f46e5"/>
    <text x="535" y="112" class="op">Conv+ReLU+Pool</text>
    <polygon points="500,188 522,188 562,163 540,163" fill="#ddd6fe" stroke="#4f46e5"/>
    <polygon points="522,188 562,163 562,217 522,242" fill="#a78bfa" stroke="#4f46e5"/>
    <rect x="500" y="188" width="22" height="54" fill="#4f46e5" stroke="#4338ca" stroke-width="1.5"/>
    <text x="535" y="322" class="label">Block 4</text>
    <text x="535" y="339" class="dim">14×14×512</text>
  </g>

  <!-- BLOCK 5: 7x7x512 -->
  <g class="block-pulse-6">
    <rect x="608" y="98" width="84" height="20" rx="5" fill="#7c3aed"/>
    <text x="650" y="112" class="op">Conv+ReLU+Pool</text>
    <polygon points="614,197 632,197 678,169 660,169" fill="#ede9fe" stroke="#7c3aed"/>
    <polygon points="632,197 678,169 678,207 632,235" fill="#c084fc" stroke="#7c3aed"/>
    <rect x="614" y="197" width="18" height="38" fill="#7c3aed" stroke="#6d28d9" stroke-width="1.5"/>
    <text x="650" y="322" class="label">Block 5</text>
    <text x="650" y="339" class="dim">7×7×512</text>
  </g>

  <!-- FLATTEN: 25,088 x 1 -->
  <g class="block-pulse-7">
    <rect x="744" y="131" width="22" height="168" rx="6" fill="#fef3c7" stroke="#d97706" stroke-width="1.8"/>
    <circle cx="755" cy="150" r="3" fill="#d97706"/>
    <circle cx="755" cy="170" r="3" fill="#d97706"/>
    <circle cx="755" cy="190" r="3" fill="#d97706"/>
    <circle cx="755" cy="215" r="3" fill="#d97706"/>
    <circle cx="755" cy="240" r="3" fill="#d97706"/>
    <circle cx="755" cy="260" r="3" fill="#d97706"/>
    <circle cx="755" cy="280" r="3" fill="#d97706"/>
    <text x="755" y="322" class="label">Flatten</text>
    <text x="755" y="339" class="dim" fill="#d97706">25,088 × 1</text>
  </g>

  <!-- DENSE NEURAL NETWORK -->
  <g class="block-pulse-7">
    <g stroke="#94a3b8" stroke-width="1.2">
      <line x1="766" y1="155" x2="835" y2="160"/>
      <line x1="766" y1="185" x2="835" y2="195"/>
      <line x1="766" y1="215" x2="835" y2="230"/>
      <line x1="766" y1="245" x2="835" y2="265"/>
      <line x1="766" y1="275" x2="835" y2="195"/>
      <line x1="835" y1="160" x2="895" y2="175"/>
      <line x1="835" y1="195" x2="895" y2="215"/>
      <line x1="835" y1="230" x2="895" y2="255"/>
      <line x1="835" y1="265" x2="895" y2="215"/>
    </g>
    <circle cx="835" cy="160" r="8" fill="#3f51b5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="835" cy="195" r="8" fill="#3f51b5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="835" cy="230" r="8" fill="#3f51b5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="835" cy="265" r="8" fill="#3f51b5" stroke="#ffffff" stroke-width="2"/>
    <circle cx="895" cy="175" r="8" fill="#0d9488" stroke="#ffffff" stroke-width="2"/>
    <circle cx="895" cy="215" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <circle cx="895" cy="255" r="8" fill="#0284c7" stroke="#ffffff" stroke-width="2"/>
    <text x="865" y="322" class="label">Dense NN</text>
    <text x="865" y="339" class="dim" fill="#0d9488">4096 → Softmax</text>
  </g>

  <!-- Material Linear Progress Bar -->
  <rect x="48" y="376" width="864" height="6" rx="3" fill="#e2e8f0"/>
  <rect x="48" y="376" width="0" height="6" rx="3" fill="url(#barGrad)">
    <animate attributeName="width" values="0;864" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
