<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" width="100%" height="420">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#131c38"/>
      <stop offset="100%" stop-color="#090d1a"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
    <style>
      .title { font: bold 18px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: url(#titleGrad); }
      .subtitle { font: 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #94a3b8; }
      .label { font: bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #f1f5f9; text-anchor: middle; }
      .dim { font: 10.5px "SF Mono", Menlo, monospace; fill: #38bdf8; text-anchor: middle; }
      .op { font: bold 10px "SF Mono", Menlo, monospace; fill: #090d1a; text-anchor: middle; }
      .cta { font: bold 12px -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; fill: #ffffff; text-anchor: middle; }
      .flow-line { stroke: #334155; stroke-width: 2; stroke-dasharray: 6 4; animation: dash 1.2s linear infinite; }
      @keyframes dash { to { stroke-dashoffset: -20; } }
      .block-pulse-1 { animation: pulse 9s infinite 0s; }
      .block-pulse-2 { animation: pulse 9s infinite 1.2s; }
      .block-pulse-3 { animation: pulse 9s infinite 2.4s; }
      .block-pulse-4 { animation: pulse 9s infinite 3.6s; }
      .block-pulse-5 { animation: pulse 9s infinite 4.8s; }
      .block-pulse-6 { animation: pulse 9s infinite 6.0s; }
      .block-pulse-7 { animation: pulse 9s infinite 7.2s; }
      @keyframes pulse {
        0%, 18%, 100% { opacity: 0.72; transform: translateY(0px); }
        8% { opacity: 1; transform: translateY(-5px); filter: url(#glow); }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="960" height="420" rx="16" fill="url(#bgGrad)" stroke="#1e293b" stroke-width="2"/>

  <!-- Header -->
  <text x="32" y="38" class="title">5-Block CNN Architecture Moving Pipeline (224×224×3 RGB → Flatten → Dense NN)</text>
  <text x="32" y="58" class="subtitle">Each Block performs: 3×3 Conv2D (expands channel depth) → ReLU max(0,x) → 2×2 Max Pooling (halves spatial height &amp; width)</text>

  <!-- Click to launch pill -->
  <rect x="720" y="20" width="210" height="34" rx="17" fill="#0284c7" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="825" y="41" class="cta">▶ Click to Open Interactive App</text>

  <!-- Connecting Flow Lines -->
  <line x1="90" y1="210" x2="860" y2="210" class="flow-line"/>

  <!-- Travelling Data Signal Particle -->
  <circle r="7" fill="#22d3ee" filter="url(#glow)">
    <animateMotion dur="9s" repeatCount="indefinite" path="M 75,210 L 190,210 L 305,210 L 420,210 L 535,210 L 650,210 L 755,210 L 875,210"/>
  </circle>

  <!-- STAGE 0: Input 224x224x3 -->
  <g class="block-pulse-1">
    <!-- 3 RGB Planes -->
    <rect x="48" y="132" width="36" height="136" rx="3" fill="#ef4444" fill-opacity="0.45" stroke="#ef4444" stroke-width="1.5"/>
    <rect x="56" y="138" width="36" height="136" rx="3" fill="#10b981" fill-opacity="0.45" stroke="#10b981" stroke-width="1.5"/>
    <rect x="64" y="144" width="36" height="136" rx="3" fill="#3b82f6" fill-opacity="0.65" stroke="#60a5fa" stroke-width="1.5"/>
    <text x="74" y="318" class="label">Input RGB</text>
    <text x="74" y="335" class="dim">224×224×3</text>
  </g>

  <!-- BLOCK 1: 112x112x64 -->
  <g class="block-pulse-2">
    <rect x="148" y="95" width="84" height="20" rx="5" fill="#38bdf8"/>
    <text x="190" y="109" class="op">Conv+ReLU+Pool</text>
    <polygon points="168,148 202,148 216,136 182,136" fill="#38bdf8" fill-opacity="0.5" stroke="#7dd3fc"/>
    <polygon points="202,148 216,136 216,250 202,262" fill="#0284c7" stroke="#7dd3fc"/>
    <rect x="168" y="148" width="34" height="114" fill="#0ea5e9" fill-opacity="0.85" stroke="#bae6fd" stroke-width="1.5"/>
    <text x="190" y="318" class="label">Block 1</text>
    <text x="190" y="335" class="dim">112×112×64</text>
  </g>

  <!-- BLOCK 2: 56x56x128 -->
  <g class="block-pulse-3">
    <rect x="263" y="95" width="84" height="20" rx="5" fill="#6366f1"/>
    <text x="305" y="109" class="op" fill="#ffffff">Conv+ReLU+Pool</text>
    <polygon points="278,160 308,160 330,144 300,144" fill="#818cf8" fill-opacity="0.5" stroke="#a5b4fc"/>
    <polygon points="308,160 330,144 330,236 308,252" fill="#4f46e5" stroke="#a5b4fc"/>
    <rect x="278" y="160" width="30" height="92" fill="#6366f1" fill-opacity="0.85" stroke="#c7d2fe" stroke-width="1.5"/>
    <text x="305" y="318" class="label">Block 2</text>
    <text x="305" y="335" class="dim">56×56×128</text>
  </g>

  <!-- BLOCK 3: 28x28x256 -->
  <g class="block-pulse-4">
    <rect x="378" y="95" width="84" height="20" rx="5" fill="#8b5cf6"/>
    <text x="420" y="109" class="op" fill="#ffffff">Conv+ReLU+Pool</text>
    <polygon points="390,172 416,172 446,152 420,152" fill="#a78bfa" fill-opacity="0.5" stroke="#ddd6fe"/>
    <polygon points="416,172 446,152 446,224 416,244" fill="#7c3aed" stroke="#ddd6fe"/>
    <rect x="390" y="172" width="26" height="72" fill="#8b5cf6" fill-opacity="0.85" stroke="#ede9fe" stroke-width="1.5"/>
    <text x="420" y="318" class="label">Block 3</text>
    <text x="420" y="335" class="dim">28×28×256</text>
  </g>

  <!-- BLOCK 4: 14x14x512 -->
  <g class="block-pulse-5">
    <rect x="493" y="95" width="84" height="20" rx="5" fill="#a855f7"/>
    <text x="535" y="109" class="op" fill="#ffffff">Conv+ReLU+Pool</text>
    <polygon points="500,183 522,183 562,158 540,158" fill="#c084fc" fill-opacity="0.5" stroke="#f3e8ff"/>
    <polygon points="522,183 562,158 562,212 522,237" fill="#9333ea" stroke="#f3e8ff"/>
    <rect x="500" y="183" width="22" height="54" fill="#a855f7" fill-opacity="0.85" stroke="#fae8ff" stroke-width="1.5"/>
    <text x="535" y="318" class="label">Block 4</text>
    <text x="535" y="335" class="dim">14×14×512</text>
  </g>

  <!-- BLOCK 5: 7x7x512 -->
  <g class="block-pulse-6">
    <rect x="608" y="95" width="84" height="20" rx="5" fill="#d946ef"/>
    <text x="650" y="109" class="op" fill="#ffffff">Conv+ReLU+Pool</text>
    <polygon points="614,192 632,192 678,164 660,164" fill="#e879f9" fill-opacity="0.5" stroke="#fae8ff"/>
    <polygon points="632,192 678,164 678,202 632,230" fill="#c026d3" stroke="#fae8ff"/>
    <rect x="614" y="192" width="18" height="38" fill="#d946ef" fill-opacity="0.85" stroke="#fdf4ff" stroke-width="1.5"/>
    <text x="650" y="318" class="label">Block 5</text>
    <text x="650" y="335" class="dim">7×7×512</text>
  </g>

  <!-- FLATTEN: 25,088 x 1 -->
  <g class="block-pulse-7">
    <rect x="744" y="126" width="22" height="168" rx="7" fill="#f59e0b" fill-opacity="0.88" stroke="#fef3c7" stroke-width="1.5"/>
    <circle cx="755" cy="145" r="3" fill="#090d1a"/>
    <circle cx="755" cy="165" r="3" fill="#090d1a"/>
    <circle cx="755" cy="185" r="3" fill="#090d1a"/>
    <circle cx="755" cy="210" r="3" fill="#090d1a"/>
    <circle cx="755" cy="235" r="3" fill="#090d1a"/>
    <circle cx="755" cy="255" r="3" fill="#090d1a"/>
    <circle cx="755" cy="275" r="3" fill="#090d1a"/>
    <text x="755" y="318" class="label">Flatten</text>
    <text x="755" y="335" class="dim" fill="#fbbf24">25,088 × 1</text>
  </g>

  <!-- DENSE NEURAL NETWORK: 4096 -> 4096 -> Softmax -->
  <g class="block-pulse-7">
    <!-- Synapses -->
    <g stroke="#10b981" stroke-opacity="0.45" stroke-width="1.2">
      <line x1="766" y1="150" x2="835" y2="155"/>
      <line x1="766" y1="180" x2="835" y2="190"/>
      <line x1="766" y1="210" x2="835" y2="225"/>
      <line x1="766" y1="240" x2="835" y2="260"/>
      <line x1="766" y1="270" x2="835" y2="190"/>
      <line x1="835" y1="155" x2="895" y2="170"/>
      <line x1="835" y1="190" x2="895" y2="210"/>
      <line x1="835" y1="225" x2="895" y2="250"/>
      <line x1="835" y1="260" x2="895" y2="210"/>
    </g>
    <!-- FC1 Nodes -->
    <circle cx="835" cy="155" r="8" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="835" cy="190" r="8" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="835" cy="225" r="8" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="835" cy="260" r="8" fill="#10b981" stroke="#ffffff" stroke-width="1.5"/>
    <!-- Output Nodes -->
    <circle cx="895" cy="170" r="8" fill="#22d3ee" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="895" cy="210" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <circle cx="895" cy="250" r="8" fill="#38bdf8" stroke="#ffffff" stroke-width="1.5"/>
    <text x="865" y="318" class="label">Dense NN</text>
    <text x="865" y="335" class="dim" fill="#34d399">4096 → Softmax</text>
  </g>

  <!-- Animated Progress Bar at Bottom -->
  <rect x="48" y="372" width="864" height="8" rx="4" fill="#1e293b"/>
  <rect x="48" y="372" width="0" height="8" rx="4" fill="url(#titleGrad)">
    <animate attributeName="width" values="0;864" dur="9s" repeatCount="indefinite"/>
  </rect>
</svg>
